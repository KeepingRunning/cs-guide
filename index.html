---
---
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>写给新人的计算机自学手册</title>
    <style>
      body {
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 24px 80px;
        background: #fff;
        color: #1f2328;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      h1, h2, h3, h4, h5, h6 {
        margin: 24px 0 16px;
        line-height: 1.25;
      }

      a {
        color: #0969da;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      ul, ol {
        padding-left: 2em;
      }

      li + li {
        margin-top: 0.4em;
      }

      blockquote {
        margin-left: 0;
        padding-left: 1em;
        border-left: 4px solid #d0d7de;
        color: #59636e;
      }

      code, pre {
        background: #f6f8fa;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      code {
        padding: 0.2em 0.4em;
      }

      pre {
        overflow: auto;
        padding: 16px;
      }

      img {
        max-width: 100%;
      }

      @media (max-width: 600px) {
        body {
          padding: 24px 16px 56px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {% capture markdown %}{% include_relative guide.md %}{% endcapture %}
      {{ markdown | markdownify }}
    </main>
  </body>
</html>
